<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espoza Admin — لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--wine:#641f34;--wine2:#431321;--gold:#b9985a;--cream:#fbf9f5;--paper:#fff;--soft:#f3f1ee;--line:#e7e0d9;--text:#241d20;--muted:#7b7075;--green:#287a55;--red:#a33b45;--shadow:0 12px 35px rgba(55,35,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,"Tahoma",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#fff,#f2e9eb)}
.loginBox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)}
.brand{font:32px Georgia,serif;letter-spacing:5px;color:var(--wine);text-align:center}.muted{color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,152,90,.12)}textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700}.primary{background:var(--wine);color:#fff}.gold{background:var(--gold);color:#21160e}.ghost{background:#fff;color:var(--wine);border:1px solid var(--line)}.danger{background:#fff0f1;color:var(--red);border:1px solid #f0cdd1}.success{background:#edf8f2;color:var(--green);border:1px solid #cde9d9}
.layout{display:flex;min-height:100vh}.side{width:245px;position:fixed;right:0;top:0;bottom:0;background:#fff;border-left:1px solid var(--line);padding:22px 15px;z-index:10}.side small{display:block;text-align:center;margin-top:5px}.nav{display:grid;gap:5px;margin-top:28px}.nav button{border:0;background:transparent;text-align:right;padding:12px;border-radius:12px;color:#665b60}.nav button:hover,.nav button.active{background:#f5ecef;color:var(--wine);font-weight:700}.main{margin-right:245px;width:calc(100% - 245px);padding:24px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0 0 5px;font-size:25px}.topActions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(50,30,35,.04)}.stat{font-size:29px;font-weight:800;color:var(--wine);margin:8px 0}.section{margin-top:18px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionHead h2,.sectionHead h3{margin:0}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}.table th{font-size:12px;color:var(--muted);background:#fcfbf9}.table tr:last-child td{border-bottom:0}.thumb{width:52px;height:64px;border-radius:9px;object-fit:cover;background:#f1eeee}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.on{background:#edf8f2;color:var(--green)}.off{background:#f3f0f1;color:#776b70}.price{font-weight:800}.old{text-decoration:line-through;color:#9a8f94;font-size:12px;margin-right:5px}.discount{color:var(--red);font-weight:700;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar>*{max-width:250px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:16px}.modal{position:fixed;inset:0;background:rgba(30,20,24,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:15px;z-index:50}.modalBox{background:#fff;width:min(820px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:22px;box-shadow:0 25px 70px rgba(30,20,24,.2)}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalHead h2{margin:0}.close{border:0;background:#f4f0ed;border-radius:10px;padding:8px 12px}.mediaGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mediaCard{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.mediaCard img,.mediaCard video{width:100%;height:145px;object-fit:cover;display:block}.mediaMeta{padding:8px;font-size:11px}.rowBtns{display:flex;gap:5px;flex-wrap:wrap}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:90px;padding:8px}.day b{font-size:12px}.orderItem{padding:10px 0;border-bottom:1px solid var(--line)}.orderItem:last-child{border:0}.mobileNav{display:none}.toast{position:fixed;left:20px;bottom:20px;background:var(--wine);color:#fff;padding:12px 16px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}.authHint{font-size:12px;line-height:1.7;margin-top:10px}.authBack{display:block;text-align:center;margin-top:12px;color:var(--wine);text-decoration:none;font-size:13px;font-weight:700}.passwordMeter{font-size:11px;margin-top:5px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.mediaGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.side{display:none}.main{margin:0;width:100%;padding:15px 15px 78px}.mobileNav{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);z-index:30;overflow:auto}.mobileNav button{flex:1;min-width:70px;background:#fff;border:0;padding:9px 5px;font-size:10px;color:#6e6267}.mobileNav button.active{color:var(--wine);font-weight:800}.cards{grid-template-columns:1fr 1fr}.grid,.grid3{grid-template-columns:1fr}.mediaGrid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top h1{font-size:21px}.toolbar>*{max-width:none;flex:1}.modalBox{padding:16px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginBox">
<div class="brand">ESPOZA</div><div style="text-align:center" class="muted">لوحة الإدارة</div>
<p class="authHint muted">بدون كلمة مرور — أدخل بريد حساب الأدمن وسنرسل لك رابط دخول آمن. لا يتم إنشاء حساب جديد.</p>
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="بريد حساب الأدمن"></div>
<button class="btn primary" style="width:100%" onclick="login()">إرسال رابط الدخول</button>
<p id="loginMsg" class="muted"></p>
</div></div>

<div id="app" class="layout hide">
<aside class="side"><div class="brand" style="font-size:25px">ESPOZA</div><small class="muted">Fashion Admin</small><div id="nav" class="nav"></div><button class="btn ghost" style="width:100%;margin-top:20px" onclick="logout()">تسجيل الخروج</button></aside>
<main class="main"><div class="top"><div><h1 id="title">الرئيسية</h1><span class="muted">إدارة المتجر والموقع من مكان واحد</span></div><div id="topActions" class="topActions"></div></div><div id="content"></div></main>
<div id="mobileNav" class="mobileNav"></div></div>

<div id="modal" class="modal hide" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modalBox"></div></div>
<div id="toast" class="toast hide"></div>

<script>
const SUPABASE_URL="https://opqbcfxqtmyebxsafeea.supabase.co";
const SUPABASE_KEY="sb_publishable_ur00aFQQv5SvMdGbv2G9Zg_fBpXEUlX";
let db=null, currentTab="dashboard", productsRows=[], mediaRows=[], ordersRows=[], categoryRows=[], settingsRows=[], sectionRows=[];

const tabs=[
["dashboard","الرئيسية"],["products","المنتجات"],["orders","الطلبات"],["media","مكتبة الصور"],["sliders","السلايدر"],["feedback","آراء الزبائن"],["categories","الفئات"],
["content","محتوى الموقع"],["delivery","التوصيل"],["coupons","الكوبونات"],["customers","الزبائن"],["settings","الإعدادات"]
];

const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hide");clearTimeout(window._toast);window._toast=setTimeout(()=>$("toast").classList.add("hide"),2500)}
function money(v){return Number(v||0).toLocaleString("en-US",{maximumFractionDigits:2})}
function discount(p){if(!p.old_price||Number(p.old_price)<=Number(p.price))return 0;return Math.round((1-Number(p.price)/Number(p.old_price))*100)}
function catName(c){return c==="sets"?"أطقم":c==="offers"?"عروضات":c==="dresses"?"فساتين":c||"—"}

async function initDb(){
 if(!window.supabase)throw new Error("تعذر تحميل Supabase");
 if(!db)db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 return db;
}
async function isAdmin(){
 const s=await db.auth.getSession();
 if(s.error)throw s.error;
 if(!s.data.session)return false;
 const r=await db.rpc("is_current_user_admin");
 if(r.error)throw r.error;
 return r.data===true;
}
function authUrlError(){
 const q=new URLSearchParams(location.search);
 const h=new URLSearchParams(location.hash.replace(/^#/,""));
 const code=q.get("error_code")||h.get("error_code")||q.get("error")||h.get("error");
 const description=q.get("error_description")||h.get("error_description");
 if(!code&&!description)return "";
 history.replaceState({},document.title,location.pathname);
 if(code==="otp_expired"||code==="access_denied")return "رابط الدخول انتهت صلاحيته أو استُخدم سابقًا. اطلب رابطًا جديدًا.";
 return description||"تعذّر إكمال الدخول من الرابط. اطلب رابطًا جديدًا وحاول فتحه في المتصفح نفسه.";
}
async function login(){
 const msg=$("loginMsg"),email=$("email").value.trim();
 if(!email)return msg.textContent="اكتب بريد حساب الأدمن أولًا.";
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return msg.textContent="تحقّق من كتابة البريد الإلكتروني بشكل صحيح.";
 msg.textContent="جارٍ إرسال رابط الدخول…";
 try{
  await initDb();
  const localHost=location.protocol==="file:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
  const redirectTo=localHost?"https://espoza-fashion.github.io/admin/":location.origin+location.pathname;
  const r=await db.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:false}});
  if(r.error)throw r.error;
  msg.textContent="تم إرسال رابط دخول آمن إلى بريدك. افتحه لإكمال الدخول على هذا الجهاز، وتأكد من فتحه في المتصفح الذي طلبت منه الرابط.";
 }catch(err){
  const detail=String(err?.message||"");
  msg.textContent=/redirect/i.test(detail)?"رابط العودة غير مسموح في إعدادات Supabase. أضف https://espoza-fashion.github.io/admin/ إلى Authentication > URL Configuration > Redirect URLs.":(detail||"تعذر إرسال رابط الدخول.");
 }
}
function showLogin(){$("app").classList.add("hide");$("login").classList.remove("hide");}
async function logout(){await db.auth.signOut();location.reload()}
async function openApp(){$("login").classList.add("hide");$("app").classList.remove("hide");renderNav();show("dashboard")}
let authValidationInFlight=false;
async function validateAdminSession(){
 if(authValidationInFlight)return;
 authValidationInFlight=true;
 try{
  const s=await db.auth.getSession();
  if(s.error)throw s.error;
  if(!s.data.session)return;
  if(await isAdmin()){await openApp();return;}
  await db.auth.signOut();
  showLogin();
  $("loginMsg").textContent="تم التحقق من البريد، لكن هذا الحساب ليس ضمن حسابات الأدمن المصرّح لها.";
 }catch(err){
  console.warn("Auth validation failed:",err);
  showLogin();
  $("loginMsg").textContent="وصل رابط الدخول، لكن تعذّر التحقق من الجلسة. اطلب رابطًا جديدًا وتأكد من فتحه في المتصفح نفسه.";
 }finally{authValidationInFlight=false;}
}
async function boot(){
 try{
  await initDb();
  const urlError=authUrlError();
  if(urlError)$("loginMsg").textContent=urlError;
  db.auth.onAuthStateChange((event,session)=>{
   if(event==="SIGNED_IN"&&session)window.setTimeout(()=>{validateAdminSession()},0);
  });
  await validateAdminSession();
 }catch(err){
  console.warn("Admin startup failed:",err);
  $("loginMsg").textContent="تعذّر الاتصال بخدمة الدخول. حدّث الصفحة وحاول مرة أخرى.";
 }
}
function renderNav(){
 const h=tabs.map(t=>'<button class="'+(currentTab===t[0]?"active":"")+'" onclick="show(\''+t[0]+'\')">'+t[1]+"</button>").join("");
 $("nav").innerHTML=h;$("mobileNav").innerHTML=h;
}
function show(tab){currentTab=tab;renderNav();const t=tabs.find(x=>x[0]===tab);$("title").textContent=t?t[1]:"";$("topActions").innerHTML="";
 if(tab==="products")$("topActions").innerHTML='<button class="btn gold" onclick="productForm()">+ منتج جديد</button>';
 if(tab==="media")$("topActions").innerHTML='<button class="btn gold" onclick="mediaForm()">+ إضافة وسائط</button>';
 if(tab==="sliders")$("topActions").innerHTML='<button class="btn gold" onclick="sliderForm()">+ سلايدر جديد</button>';
 if(tab==="feedback")$("topActions").innerHTML='<button class="btn gold" onclick="feedbackForm()">+ رأي جديد</button>';
 if(tab==="categories")$("topActions").innerHTML='<button class="btn gold" onclick="categoryForm()">+ فئة جديدة</button>';
 if(tab==="content")$("topActions").innerHTML='<button class="btn gold" onclick="sectionForm()">+ قسم جديد</button>';
 if(tab==="delivery")$("topActions").innerHTML='<button class="btn gold" onclick="deliveryForm()">+ منطقة جديدة</button>';
 if(tab==="coupons")$("topActions").innerHTML='<button class="btn gold" onclick="couponForm()">+ كوبون</button>';
 const fn={dashboard,products,orders,media,categories,content,delivery,coupons,customers,settings}[tab];fn();
}
function openModal(html){$("modalBox").innerHTML=html;$("modal").classList.remove("hide")}
function closeModal(){$("modal").classList.add("hide")}

async function dashboard(){
 const [p,o,c,m]=await Promise.all([
 db.from("products").select("id,active,price,old_price"),
 db.from("orders").select("id,status,total,created_at,customer_name,phone").order("created_at",{ascending:false}).limit(8),
 db.from("customers").select("id"),
 db.from("media_library").select("id")
 ]);
 const ps=p.data||[],os=o.data||[];
 const revenue=os.filter(x=>x.status!=="cancelled").reduce((a,x)=>a+Number(x.total||0),0);
 $("content").innerHTML='<div class="cards">'+
 stat("المنتجات",ps.length,ps.filter(x=>x.active).length+" مفعلة")+
 stat("طلبات جديدة",os.filter(x=>x.status==="new").length,"من آخر الطلبات")+
 stat("قيمة الطلبات",money(revenue)+" ₪","غير الملغاة")+
 stat("الزبائن",c.data?.length||0,"سجلات العملاء")+
 '</div><div class="section"><div class="sectionHead"><h2>آخر الطلبات</h2><button class="btn ghost" onclick="show(\'orders\')">عرض الكل</button></div>'+
 orderTable(os)+'</div>';
}
function stat(title,value,sub){return '<div class="card"><span class="muted">'+title+'</span><div class="stat">'+value+'</div><small class="muted">'+sub+'</small></div>'}
function orderTable(a){if(!a.length)return '<div class="card">لا توجد طلبات حتى الآن.</div>';return '<div class="tablewrap"><table class="table"><thead><tr><th>الزبون</th><th>الهاتف</th><th>الحالة</th><th>الإجمالي</th><th>التاريخ</th><th></th></tr></thead><tbody>'+a.map(o=>'<tr><td>'+esc(o.customer_name)+'</td><td>'+esc(o.phone)+'</td><td>'+statusBadge(o.status)+'</td><td>'+money(o.total)+' ₪</td><td>'+new Date(o.created_at).toLocaleString("ar")+'</td><td><button class="btn ghost" onclick="orderForm(\''+o.id+'\')">تفاصيل</button></td></tr>').join("")+'</tbody></table></div>'}
function statusBadge(s){const map={new:"جديد",review:"مراجعة",confirmed:"مؤكد",preparing:"قيد التجهيز",shipped:"تم الشحن",completed:"مكتمل",cancelled:"ملغي",pending:"معلّق"};return '<span class="badge '+(s==="cancelled"?"off":"on")+'">'+(map[s]||s||"—")+'</span>'}

async function products(){
 const r=await db.from("products").select("*,product_sizes(*),product_colors(*),product_images(*)").order("sort_order").order("created_at",{ascending:false});productsRows=r.data||[];
 $("content").innerHTML='<div class="toolbar"><input id="pq" placeholder="بحث باسم المنتج أو SKU" oninput="renderProducts()"><select id="pcat" onchange="renderProducts()"><option value="">كل الفئات</option><option value="dresses">فساتين</option><option value="sets">أطقم</option><option value="offers">عروضات</option></select><select id="pstate" onchange="renderProducts()"><option value="">كل الحالات</option><option value="active">مفعلة</option><option value="hidden">مخفية</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>صورة</th><th>المنتج</th><th>السعر</th><th>الخصم</th><th>الفئة</th><th>المقاسات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="productBody"></tbody></table></div>';renderProducts();
}
function renderProducts(){const q=($("pq")?.value||"").toLowerCase(),c=$("pcat")?.value||"",s=$("pstate")?.value||"";const a=productsRows.filter(p=>(!q||String(p.name).toLowerCase().includes(q)||String(p.sku||"").toLowerCase().includes(q))&&(!c||p.category===c)&&(!s||(s==="active"?p.active:!p.active)));$("productBody").innerHTML=a.map(p=>{const im=p.product_images?.sort((x,y)=>(x.sort_order||0)-(y.sort_order||0))[0]?.image_url;return '<tr><td>'+(im?'<img class="thumb" src="'+esc(im)+'">':"—")+'</td><td><b>'+esc(p.name)+'</b><br><small class="muted">'+esc(p.sku||"بدون SKU")+'</small></td><td><span class="price">'+money(p.price)+' ₪</span>'+(p.old_price?'<span class="old">'+money(p.old_price)+' ₪</span>':"")+'</td><td>'+(discount(p)?'<span class="discount">-'+discount(p)+'%</span>':"—")+'</td><td>'+catName(p.category)+'</td><td>'+esc((p.product_sizes||[]).map(x=>x.size).join("، "))+'</td><td>'+(p.active?'<span class="badge on">مفعّل</span>':'<span class="badge off">مخفي</span>')+'</td><td><div class="rowBtns"><button class="btn ghost" onclick="quickPrice(\''+p.id+'\')">السعر</button><button class="btn ghost" onclick="productForm(\''+p.id+'\')">تعديل</button><button class="btn danger" onclick="toggleProduct(\''+p.id+'\')">'+(p.active?"إخفاء":"تفعيل")+'</button><button class="btn danger" onclick="deleteProduct(\''+p.id+'\')">حذف</button></div></td></tr>'}).join("")||'<tr><td colspan="8" style="text-align:center;padding:30px">لا توجد نتائج</td></tr>'}

function productForm(id){
 window.editingProductId=id||"";
 const p=id?productsRows.find(x=>x.id===id):{name:"",category:"dresses",price:0,old_price:"",description:"",active:true,featured:false,sku:"",stock:"",tags:[],product_sizes:[],product_colors:[],product_images:[]};
 openModal('<div class="modalHead"><h2>'+ (id?"تعديل المنتج":"إضافة منتج")+'</h2><button class="close" onclick="closeModal()">×</button></div>'+
 '<div class="grid"><div class="field"><label>اسم المنتج بالعربي</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>اسم المنتج بالإنجليزي</label><input id="pnen" value="'+esc(p.name_en||"")+'" placeholder="Product name"></div><div class="field"><label>SKU اختياري</label><input id="psku" value="'+esc(p.sku||"")+'"></div><div class="field"><label>الفئة</label><select id="pc"></select></div><div class="field"><label>السعر الحالي</label><input id="pp" type="number" min="0" value="'+p.price+'"></div><div class="field"><label>السعر القديم</label><input id="po" type="number" min="0" value="'+(p.old_price??"")+'"></div><div class="field"><label>المخزون (اختياري)</label><input id="stock" type="number" min="0" value="'+(p.stock??"")+'"></div></div>'+
 '<div class="field"><label>المقاسات</label><input id="psz" value="'+esc((p.product_sizes||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(x=>x.size).join(", "))+'"></div>'+
 '<div class="field"><label>الألوان</label><div id="colorRows"></div><button class="btn ghost" type="button" onclick="addColor()">+ لون</button></div>'+
  '<div class="field"><label>صور المنتج</label><textarea id="pimgs" placeholder="يمكنك اختيار صور من المكتبة أو رفعها من جهازك">'+esc((p.product_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(x=>x.image_url).join("\n"))+'</textarea><div class="rowBtns" style="margin-top:8px"><button class="btn ghost" type="button" onclick="chooseMediaForProduct()">🖼️ اختيار من المكتبة</button><button class="btn gold" type="button" onclick="pickProductImage()">📤 رفع صورة من الجهاز</button></div></div>'+

function addColor(name="",hex=""){const wrap=$("colorRows"),row=document.createElement("div");row.className="grid";row.style.marginBottom="7px";row.innerHTML='<input class="cname" placeholder="اسم اللون" value="'+esc(name)+'"><input class="chex" placeholder="#hex اختياري" value="'+esc(hex||"")+'">';wrap.appendChild(row)}
function colorData(){return [...document.querySelectorAll("#colorRows .grid")].map((r,i)=>({name:r.querySelector(".cname").value.trim(),hex:r.querySelector(".chex").value.trim()||null,sort_order:i})).filter(x=>x.name)}
async function saveProduct(id){
 const p={name:$("pn").value.trim(),name_en:$("pnen").value.trim()||null,sku:$("psku").value.trim()||null,category:$("pc").value,price:Number($("pp").value||0),old_price:$("po").value?Number($("po").value):null,stock:$("stock").value===""?null:Number($("stock").value),description:$("pdesc").value,description_en:$("pdescen").value.trim()||null,active:$("active").checked,featured:$("featured").checked,updated_at:new Date().toISOString()};
 if(!p.name)return toast("اسم المنتج مطلوب.");
 let productId=id;
 if(id){const r=await db.from("products").update(p).eq("id",id);if(r.error)return toast(r.error.message)}
 else{const r=await db.from("products").insert(p).select("id").single();if(r.error)return toast(r.error.message);productId=r.data.id}
 const sizes=$("psz").value.split(",").map(x=>x.trim()).filter(Boolean).map((size,i)=>({size,sort_order:i}));
 const colors=colorData().map(x=>({...x,product_id:productId}));
 const links=$("pimgs").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const existing=(productsRows.find(x=>x.id===productId)?.product_images||[]);
 const existingUrls=new Set(existing.map(x=>x.image_url));
 const newUrls=links.filter(x=>!existingUrls.has(x));
 const removed=existing.filter(x=>!links.includes(x));
 for(const x of removed){const r=await db.from("product_images").delete().eq("id",x.id);if(r.error)return toast("فشل حذف صورة: "+r.error.message)}
 if(newUrls.length){const r=await db.from("product_images").insert(newUrls.map((url,i)=>({product_id:productId,image_url:url,sort_order:links.indexOf(url),alt_text:p.name})));if(r.error)return toast(r.error.message)}
 const oldSizes=productsRows.find(x=>x.id===productId)?.product_sizes||[];const oldBySize=new Map(oldSizes.map(x=>[x.size,x]));
 for(const [i,s] of sizes.entries()){const old=oldBySize.get(s.size);if(old)await db.from("product_sizes").update({sort_order:i}).eq("id",old.id);else await db.from("product_sizes").insert({product_id:productId,...s})}
 for(const old of oldSizes)if(!sizes.some(s=>s.size===old.size)){const r=await db.from("product_sizes").delete().eq("id",old.id);if(r.error)return toast(r.error.message)}
 const oldColors=productsRows.find(x=>x.id===productId)?.product_colors||[];
 for(const old of oldColors)if(!colors.some(c=>c.name===old.name)){const r=await db.from("product_colors").delete().eq("id",old.id);if(r.error)return toast(r.error.message)}
 for(const [i,c] of colors.entries()){const old=oldColors.find(x=>x.name===c.name);if(old)await db.from("product_colors").update({hex:c.hex,sort_order:i}).eq("id",old.id);else await db.from("product_colors").insert(c)}
 closeModal();toast(id?"تم تحديث المنتج بأمان.":"تمت إضافة المنتج.");products();
}

}

async function orders(){const r=await db.from("orders").select("*").order("created_at",{ascending:false});ordersRows=r.data||[];$("content").innerHTML='<div class="toolbar"><select id="os" onchange="renderOrders()"><option value="">كل الحالات</option><option>new</option><option>review</option><option>confirmed</option><option>preparing</option><option>shipped</option><option>completed</option><option>cancelled</option></select><input id="oq" placeholder="بحث باسم أو هاتف" oninput="renderOrders()"></div><div id="ordersWrap"></div>';renderOrders()}
function renderOrders(){const q=($("oq")?.value||"").toLowerCase(),s=$("os")?.value||"";const a=ordersRows.filter(o=>(!q||String(o.customer_name).toLowerCase().includes(q)||String(o.phone).includes(q))&&(!s||o.status===s));$("ordersWrap").innerHTML=orderTable(a)}
async function orderForm(id){const r=await db.from("orders").select("*").eq("id",id).single();if(r.error)return toast(r.error.message);const o=r.data;let items=[];try{items=Array.isArray(o.items)?o.items:[]}catch(e){}openModal('<div class="modalHead"><h2>طلب #'+esc(o.id.slice(0,8))+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid"><div><b>الزبون</b><p>'+esc(o.customer_name)+'</p></div><div><b>الهاتف</b><p>'+esc(o.phone)+'</p></div><div><b>المنطقة</b><p>'+esc(o.region||"")+'</p></div><div><b>العنوان</b><p>'+esc(o.address||"")+'</p></div></div><div class="field"><label>الحالة</label><select id="ost"><option>new</option><option>review</option><option>confirmed</option><option>preparing</option><option>shipped</option><option>completed</option><option>cancelled</option></select></div><div class="field"><label>ملاحظات داخلية</label><textarea id="oin">'+esc(o.internal_notes||"")+'</textarea></div><h3>المنتجات</h3>'+items.map(i=>'<div class="orderItem"><b>'+esc(i.name||"")+'</b> × '+esc(i.qty||1)+' — '+money(i.price||0)+' ₪</div>').join("")+'<div style="margin-top:12px"><b>المنتجات:</b> '+money(o.subtotal)+' ₪ &nbsp; <b>التوصيل:</b> '+money(o.delivery_fee)+' ₪ &nbsp; <b>الإجمالي:</b> '+money(o.total)+' ₪</div><div class="actions"><button class="btn gold" onclick="saveOrder(\''+id+'\')">حفظ الطلب</button></div>');$("ost").value=o.status||"new"}
async function saveOrder(id){const r=await db.from("orders").update({status:$("ost").value,internal_notes:$("oin").value,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);closeModal();toast("تم تحديث الطلب.");orders()}

async function content(){const [s,f]=await Promise.all([db.from("site_sections").select("*").order("sort_order"),db.from("feedback").select("*").order("sort_order")]);sectionRows=s.data||[];$("content").innerHTML='<div class="section"><div class="sectionHead"><h2>أقسام الموقع</h2><span class="muted">الترتيب والظهور والمحتوى القابل للإدارة</span></div><div class="tablewrap"><table class="table"><thead><tr><th>القسم</th><th>العنوان</th><th>ظاهر</th><th>الترتيب</th><th></th></tr></thead><tbody>'+sectionRows.map(x=>'<tr><td>'+esc(x.section_key)+'</td><td>'+esc(x.title_ar||"")+'</td><td>'+(x.visible?'<span class="badge on">نعم</span>':'<span class="badge off">لا</span>')+'</td><td>'+x.sort_order+'</td><td><button class="btn ghost" onclick="sectionForm(\''+x.id+'\')">تعديل</button></td></tr>').join("")+'</tbody></table></div></div><div class="section"><div class="sectionHead"><h2>آراء الزبائن</h2><span class="muted">'+(f.data||[]).length+' صورة</span></div><div class="mediaGrid">'+(f.data||[]).map(x=>'<div class="mediaCard"><img src="'+esc(x.image_url)+'"><div class="mediaMeta"><b>'+esc(x.title||"رأي زبونة")+'</b><br><span class="badge '+(x.active?"on":"off")+'">'+(x.active?"ظاهر":"مخفي")+'</span></div></div>').join("")+'</div></div>'}
function sectionForm(id){const s=id?sectionRows.find(x=>x.id===id):{section_key:"new_section",title_ar:"",title_en:"",config:{},visible:true,sort_order:0};openModal('<div class="modalHead"><h2>قسم الموقع</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid"><div class="field"><label>مفتاح القسم</label><input id="sk" value="'+esc(s.section_key)+'"></div><div class="field"><label>الترتيب</label><input id="so" type="number" value="'+s.sort_order+'"></div><div class="field"><label>العنوان العربي</label><input id="sa" value="'+esc(s.title_ar||"")+'"></div><div class="field"><label>العنوان الإنجليزي</label><input id="se" value="'+esc(s.title_en||"")+'"></div></div><div class="field"><label>إعدادات القسم JSON</label><textarea id="sc">'+esc(JSON.stringify(s.config||{},null,2))+'</textarea></div><label><input id="sv" type="checkbox" '+(s.visible?"checked":"")+'> ظاهر</label><div class="actions"><button class="btn gold" onclick="saveSection(\''+(id||"")+'\')">حفظ</button></div>')}
async function saveSection(id){let config={};try{config=JSON.parse($("sc").value||"{}")}catch(e){return toast("JSON غير صحيح.")}const p={section_key:$("sk").value.trim(),title_ar:$("sa").value,title_en:$("se").value,config,visible:$("sv").checked,sort_order:Number($("so").value||0),updated_at:new Date().toISOString()};const r=id?await db.from("site_sections").update(p).eq("id",id):await db.from("site_sections").insert(p);if(r.error)return toast(r.error.message);closeModal();content()}

async function delivery(){const r=await db.from("delivery_areas").select("*").order("sort_order");const a=r.data||[];$("content").innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>المنطقة</th><th>السعر</th><th>الحالة</th><th>الترتيب</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.area_name)+'</td><td>'+money(x.price)+' ₪</td><td>'+(x.active?'<span class="badge on">مفعلة</span>':'<span class="badge off">مخفية</span>')+'</td><td>'+x.sort_order+'</td><td><button class="btn ghost" onclick="deliveryForm(\''+x.id+'\')">تعديل</button></td></tr>').join("")+'</tbody></table></div>'}
function deliveryForm(id){db.from("delivery_areas").select("*").order("sort_order").then(r=>{const x=id?(r.data||[]).find(z=>z.id===id):{area_name:"",price:0,active:true,sort_order:0};openModal('<div class="modalHead"><h2>منطقة التوصيل</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid"><div class="field"><label>المنطقة</label><input id="da" value="'+esc(x.area_name)+'"></div><div class="field"><label>السعر ₪</label><input id="dp" type="number" value="'+x.price+'"></div><div class="field"><label>الترتيب</label><input id="do" type="number" value="'+x.sort_order+'"></div></div><label><input id="dv" type="checkbox" '+(x.active?"checked":"")+'> مفعلة</label><div class="actions"><button class="btn gold" onclick="saveDelivery(\''+(id||"")+'\')">حفظ</button></div>')})}
async function saveDelivery(id){const p={area_name:$("da").value.trim(),price:Number($("dp").value||0),sort_order:Number($("do").value||0),active:$("dv").checked};const r=id?await db.from("delivery_areas").update(p).eq("id",id):await db.from("delivery_areas").insert(p);if(r.error)return toast(r.error.message);closeModal();delivery()}

async function coupons(){const r=await db.from("coupons").select("*").order("created_at",{ascending:false});const a=r.data||[];$("content").innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>الكود</th><th>الخصم</th><th>الحد الأدنى</th><th>الاستخدام</th><th>الحالة</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+money(x.discount_value)+(x.discount_type==="percent"?"%":" ₪")+'</td><td>'+money(x.min_order)+' ₪</td><td>'+x.used_count+(x.usage_limit?"/"+x.usage_limit:"")+'</td><td>'+(x.active?'<span class="badge on">فعال</span>':'<span class="badge off">متوقف</span>')+'</td><td><button class="btn ghost" onclick="couponForm(\''+x.id+'\')">تعديل</button></td></tr>').join("")+'</tbody></table></div>'}
function couponForm(id){db.from("coupons").select("*").then(r=>{const x=id?(r.data||[]).find(z=>z.id===id):{code:"",discount_type:"percent",discount_value:0,min_order:0,usage_limit:"",active:true};openModal('<div class="modalHead"><h2>كوبون خصم</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid"><div class="field"><label>الكود</label><input id="ccode" value="'+esc(x.code)+'"></div><div class="field"><label>نوع الخصم</label><select id="ctype"><option value="percent">نسبة %</option><option value="fixed">مبلغ ₪</option></select></div><div class="field"><label>قيمة الخصم</label><input id="cval" type="number" value="'+x.discount_value+'"></div><div class="field"><label>الحد الأدنى للطلب</label><input id="cmin" type="number" value="'+x.min_order+'"></div><div class="field"><label>حد الاستخدام</label><input id="climit" type="number" value="'+(x.usage_limit??"")+'"></div></div><label><input id="cact" type="checkbox" '+(x.active?"checked":"")+'> فعال</label><div class="actions"><button class="btn gold" onclick="saveCoupon(\''+(id||"")+'\')">حفظ</button></div>');$("ctype").value=x.discount_type})}
async function saveCoupon(id){const p={code:$("ccode").value.trim().toUpperCase(),discount_type:$("ctype").value,discount_value:Number($("cval").value||0),min_order:Number($("cmin").value||0),usage_limit:$("climit").value?Number($("climit").value):null,active:$("cact").checked,updated_at:new Date().toISOString()};if(!p.code)return toast("اكتب الكود.");const r=id?await db.from("coupons").update(p).eq("id",id):await db.from("coupons").insert(p);if(r.error)return toast(r.error.message);closeModal();coupons()}

async function customers(){const r=await db.from("customers").select("*").order("updated_at",{ascending:false});const a=r.data||[];$("content").innerHTML='<div class="toolbar"><input id="cq" placeholder="بحث بالاسم أو الهاتف" oninput="renderCustomers()"></div><div id="custWrap"></div>';window.customerRows=a;renderCustomers()}
function renderCustomers(){const q=($("cq")?.value||"").toLowerCase();const a=(window.customerRows||[]).filter(x=>!q||String(x.name).toLowerCase().includes(q)||String(x.phone||"").includes(q));$("custWrap").innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>الاسم</th><th>واتساب/هاتف</th><th>الإيميل</th><th>الطلبات</th><th>إجمالي الشراء</th><th>ملاحظات</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.phone||"—")+'</td><td>'+esc(x.email||"—")+'</td><td>'+x.total_orders+'</td><td>'+money(x.total_spend)+' ₪</td><td>'+esc(x.notes||"—")+'</td></tr>').join("")+'</tbody></table></div>'}

async function settings(){const r=await db.from("store_settings").select("*").order("key");settingsRows=r.data||[];$("content").innerHTML='<div class="grid">'+settingsRows.map(x=>'<div class="card"><div class="field"><label>'+esc(x.key)+'</label><textarea id="set_'+x.id+'">'+esc(typeof x.value==="object"?JSON.stringify(x.value,null,2):x.value)+'</textarea></div><button class="btn gold" onclick="saveSetting(\''+x.id+'\')">حفظ</button></div>').join("")+'</div>'}
async function saveSetting(id){const row=settingsRows.find(x=>x.id===id);let value=$("set_"+id).value;try{value=JSON.parse(value)}catch(e){}const r=await db.from("store_settings").update({value,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);toast("تم حفظ الإعداد.");settings()}

boot();
</script>
</body>
</html>
